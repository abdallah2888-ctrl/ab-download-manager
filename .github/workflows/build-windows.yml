name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up JBR
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: win-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: win-gradle-

      - name: Skip Android
        shell: bash
        run: echo "SKIP_ANDROID_BUILD=true" >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: ./gradlew createReleaseFolderForCi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ABDM-Windows
          path: ./build/ci-release/binaries/*
